name: Deploy

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      runner:
        description: 'Select runner'
        required: true
        type: choice
        options:
          - self-hosted
          - ubuntu-latest

jobs:
  deploy:
    runs-on: ${{ inputs.runner || 'self-hosted' }}

    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            cd ${{ secrets.DEPLOY_PATH || '/home/pelonis/files-converter-api' }}

            # Pull latest code
            git pull origin main

            # Build Docker image
            docker build -t files-converter-api .

            # Stop and remove old container (if running)
            docker stop files-converter-api 2>/dev/null || true
            docker rm files-converter-api 2>/dev/null || true

            # Start new container
            docker run -d \
              --name files-converter-api \
              --restart unless-stopped \
              -p 4001:4001 \
              --env-file /home/pelonis/files-converter-api/.env \
              --log-driver json-file \
              --log-opt max-size=50m \
              --log-opt max-file=5 \
              files-converter-api

            # Clean up old Docker images
            docker image prune -f
